<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Resenhas 🎬🎮🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Central de Resenhas 🍿🎮🎧</h1>
    <p>Guarde as suas opiniões e descubra os seus conteúdos favoritos</p>
  </header>

  <div class="container">
    <section class="form-container">
      <h2>+ Adicionar Resenha</h2>
      <form id="reviewForm">
        <div class="form-group">
          <label for="title">Título</label>
          <input type="text" id="title" placeholder="Ex: Interstellar, Chrono Trigger..." required>
        </div>

        <div class="form-group">
          <label for="category">Categoria</label>
          <select id="category" required>
            <option value="filme">Filme</option>
            <option value="game">Game</option>
            <option value="musica">Música</option>
          </select>
        </div>

        <div class="form-group">
          <label for="rating">Nota (1 a 5 ⭐)</label>
          <select id="rating" required>
            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
            <option value="4">⭐⭐⭐⭐ (4/5)</option>
            <option value="3">⭐⭐⭐ (3/5)</option>
            <option value="2">⭐⭐ (2/5)</option>
            <option value="1">⭐ (1/5)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tag">Tag Especial</label>
          <input type="text" id="tag" placeholder="Ex: Para passar o tempo, Final incrível...">
        </div>

        <div class="form-group">
          <label for="review">A sua Opinião</label>
          <textarea id="review" placeholder="Escreva um breve comentário..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Publicar Resenha</button>
      </form>
    </section>

    <main>
      <div class="filter-bar">
        <button class="filter-btn active" data-category="todos">Todos</button>
        <button class="filter-btn" data-category="filme">🎬 Filmes</button>
        <button class="filter-btn" data-category="game">🎮 Games</button>
        <button class="filter-btn" data-category="musica">🎵 Músicas</button>
      </div>

      <div class="cards-grid" id="cardsGrid">
        </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
